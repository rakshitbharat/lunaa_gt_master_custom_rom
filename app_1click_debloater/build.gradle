plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lunaa.debloater'
    compileSdk 34

    defaultConfig {
        applicationId "com.lunaa.debloater"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // Zero third-party dependencies: Pure Android framework APIs only
}
